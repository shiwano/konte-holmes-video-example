<div id="stage"><div data-composition-id="shot-timeline.overlay" data-start="0" data-duration="571.5" style="position:absolute;top:0;left:0;width:100%;height:100%;"></div></div><template id="shot-timeline.overlay-template"><div data-konte-line="03:1" data-konte-said="ワトスン、金儲けの機会だよ。" class="konte-clip konte-subtitle" data-start="25.78" data-duration="2.219999999999999" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">There's money in this, Watson.</span></div><div data-konte-line="03:1" data-konte-said="ガリデブという名前を聞いたことはあるかね？" class="konte-clip konte-subtitle" data-start="28.36" data-duration="2.34" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Have you ever heard the name Garrideb?</span></div><div data-konte-line="04:1" class="konte-clip konte-subtitle" data-start="31.66" data-duration="1.7999999999999936" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">No, I can't say I have.</span></div><div data-konte-line="04:2" class="konte-clip konte-subtitle" data-start="34.08" data-duration="3.3599999999999994" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Then find a Garrideb, and there's money in it.</span></div><div data-konte-line="05:1" class="konte-clip konte-subtitle" data-start="39.02" data-duration="0.8399999999999963" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Why?</span></div><div data-konte-line="05:2" data-konte-said="長い話でね——それも、ずいぶん風変わりな話だ。" class="konte-clip konte-subtitle" data-start="40.58" data-duration="3.780000000000001" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Ah, that's a long story — and a most whimsical one.</span></div><div data-konte-line="05:2" data-konte-said="人間の複雑さをずいぶん探ってきたが、" class="konte-clip konte-subtitle" data-start="44.84" data-duration="2.3999999999999915" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I have explored many complexities of human nature,</span></div><div data-konte-line="05:2" data-konte-said="これほど奇妙なものには出くわしたことがない。" class="konte-clip konte-subtitle" data-start="47.3" data-duration="2.519999999999996" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">but I've never met anything so strange.</span></div><div data-konte-line="06:1" data-konte-said="当の本人がまもなく尋問を受けに来るから、" class="konte-clip konte-subtitle" data-start="50.72" data-duration="2.5799999999999983" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">The man himself will be here shortly for questioning,</span></div><div data-konte-line="06:1" data-konte-said="それまでは話さないでおこう。とにかく、その名前が要るんだ。" class="konte-clip konte-subtitle" data-start="53.3" data-duration="3.8400000000000034" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">so I'll say nothing until then. The point is, we need that name.</span></div><div data-konte-line="09:1" class="konte-clip konte-subtitle" data-start="72.66" data-duration="1.9200000000000017" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Here it is, Holmes! Here!</span></div><div data-konte-line="11:1" data-konte-said="『ガリデブ、N。リトル・ライダー街、百三十六番地』……" class="konte-clip konte-subtitle" data-start="79.66" data-duration="4.079999999999998" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">'Garrideb, N. 136 Little Ryder Street.'</span></div><div data-konte-line="11:1" data-konte-said="残念だがワトスン、これは手紙の差出人本人だよ。" class="konte-clip konte-subtitle" data-start="84.34" data-duration="3.5999999999999943" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I'm sorry, Watson, but that's the man who wrote the letter.</span></div><div data-konte-line="11:1" data-konte-said="住所が同じだ。もう一人、対になる者が要るんだ。" class="konte-clip konte-subtitle" data-start="88.18" data-duration="3.6599999999999824" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Same address. We need another to match him.</span></div><div data-konte-line="13:1" data-konte-said="なんと、ここにもいたぞ！今度は頭文字が違う。" class="konte-clip konte-subtitle" data-start="97.96" data-duration="3.780000000000001" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Why, here's another! And different initials this time.</span></div><div data-konte-line="13:1" data-konte-said="ジョン・ガリデブ、弁護士。アメリカ合衆国、カンザス州ムアヴィル。" class="konte-clip konte-subtitle" data-start="101.98" data-duration="4.799999999999997" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">John Garrideb, Counsellor at Law. Moorville, Kansas, U.S.A.</span></div><div data-konte-line="14:1" data-konte-said="残念だが、もうひと頑張りしてもらわないとね、ワトスン。" class="konte-clip konte-subtitle" data-start="107.78" data-duration="2.8799999999999955" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I'm afraid you must try again, Watson.</span></div><div data-konte-line="14:1" data-konte-said="この紳士も、すでに一枚噛んでいるんだ。" class="konte-clip konte-subtitle" data-start="110.96" data-duration="2.5200000000000102" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">This gentleman is already in the plot.</span></div><div data-konte-line="15:1" data-konte-said="こんなに早く来るとは思っていなかったが。" class="konte-clip konte-subtitle" data-start="116.64" data-duration="2.280000000000001" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I hadn't expected him so soon.</span></div><div data-konte-line="15:1" data-konte-said="まあいい、私の知りたいことを、たっぷり聞かせてくれるはずだ。" class="konte-clip konte-subtitle" data-start="119.34" data-duration="3.6599999999999966" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Still, he should tell us a good deal of what I want to know.</span></div><div data-konte-line="17:1" data-konte-said="ホームズさんですか？ああ、やっぱり！" class="konte-clip konte-subtitle" data-start="129.26" data-duration="2.940000000000026" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Mr. Sherlock Holmes? Ah, I thought so —</span></div><div data-konte-line="17:1" data-konte-said="挿絵とそっくりですな。" class="konte-clip konte-subtitle" data-start="132.5" data-duration="1.6200000000000045" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">you're the image of your pictures.</span></div><div data-konte-line="17:1" data-konte-said="同じ名字のネイサン・ガリデブさんから、手紙が届いているでしょう？" class="konte-clip konte-subtitle" data-start="134.6" data-duration="4.0800000000000125" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">You've had a letter from my namesake, Mr. Nathan Garrideb, haven't you?</span></div><div data-konte-line="18:1" class="konte-clip konte-subtitle" data-start="140.66" data-duration="3.6000000000000227" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Do sit down. I fancy we have a good deal to discuss.</span></div><div data-konte-line="19:1" data-konte-said="あなたが、この書類にあるジョン・ガリデブ氏ですね。" class="konte-clip konte-subtitle" data-start="145.6" data-duration="2.8200000000000216" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">You are Mr. John Garrideb, mentioned in this document.</span></div><div data-konte-line="19:1" data-konte-said="しかし、英国にはもうだいぶ長くおられるのでは？" class="konte-clip konte-subtitle" data-start="148.66" data-duration="2.3799999999999955" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But surely you have been in England some time?</span></div><div data-konte-line="20:1" class="konte-clip konte-subtitle" data-start="153.02" data-duration="2.460000000000008" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Why do you say that, Mr. Holmes?</span></div><div data-konte-line="21:1" class="konte-clip konte-subtitle" data-start="156.72" data-duration="2.0400000000000205" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Your whole outfit is English.</span></div><div data-konte-line="22:1" data-konte-said="あなたの手品のことは読んでますがね、まさか自分がネタにされるとは。" class="konte-clip konte-subtitle" data-start="159.6" data-duration="4.380000000000024" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I've read of your tricks, but I never thought I'd be the subject of them.</span></div><div data-konte-line="22:1" data-konte-said="どこでそんなことを？" class="konte-clip konte-subtitle" data-start="164.04" data-duration="1.960000000000008" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Where do you read that?</span></div><div data-konte-line="23:1" data-konte-said="上着の肩の裁ち方、ブーツのつま先——" class="konte-clip konte-subtitle" data-start="166.66" data-duration="2.460000000000008" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">The shoulder cut of your coat, the toes of your boots —</span></div><div data-konte-line="23:1" data-konte-said="誰が見たって明らかですよ。" class="konte-clip konte-subtitle" data-start="169.3" data-duration="1.8000000000000114" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">could anyone doubt it?</span></div><div data-konte-line="24:1" data-konte-said="いやはや、そんなに英国人らしく見えるとはね。" class="konte-clip konte-subtitle" data-start="173.08" data-duration="3.5999999999999943" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Well, I had no idea I was so obvious a Britisher.</span></div><div data-konte-line="24:1" data-konte-said="仕事でしばらく前にこっちへ来たもんで、" class="konte-clip konte-subtitle" data-start="178.18" data-duration="2.640000000000015" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Business brought me over here some time ago,</span></div><div data-konte-line="24:1" data-konte-said="おっしゃるとおり、身なりはほとんどロンドン仕込みですよ。" class="konte-clip konte-subtitle" data-start="181.06" data-duration="3.259999999999991" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">and so, as you say, my outfit is nearly all London.</span></div><div data-konte-line="25:1" data-konte-said="だが、お忙しいでしょうし、" class="konte-clip konte-subtitle" data-start="185.6" data-duration="1.5600000000000023" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But I guess your time is valuable,</span></div><div data-konte-line="25:1" data-konte-said="靴下の仕立ての話をしに来たわけじゃない。" class="konte-clip konte-subtitle" data-start="187.16" data-duration="2.460000000000008" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">and we didn't meet to talk about the cut of my socks.</span></div><div data-konte-line="25:1" data-konte-said="その手にある書類の話に入りませんか？" class="konte-clip konte-subtitle" data-start="189.68" data-duration="2.1200000000000045" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">What about getting down to that paper you hold in your hand?</span></div><div data-konte-line="26:1" data-konte-said="まあまあ、落ち着いて、ガリデブさん。" class="konte-clip konte-subtitle" data-start="193.04" data-duration="2.0400000000000205" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Patience, Mr. Garrideb, patience!</span></div><div data-konte-line="26:1" data-konte-said="ワトスン君に聞けばわかるが、私のこういう脱線は、" class="konte-clip konte-subtitle" data-start="195.26" data-duration="2.8799999999999955" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Dr. Watson would tell you that these little digressions of mine</span></div><div data-konte-line="26:1" data-konte-said="最後には案外、本筋に関わってくるものでしてね。" class="konte-clip konte-subtitle" data-start="198.14" data-duration="2.880000000000024" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">sometimes prove to bear on the matter in the end.</span></div><div data-konte-line="27:1" class="konte-clip konte-subtitle" data-start="202.46" data-duration="4.02000000000001" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But why did Mr. Nathan Garrideb not come with you?</span></div><div data-konte-line="28:1" data-konte-said="そもそも、なんであんたなんかを引っぱり込んだんだ！" class="konte-clip konte-subtitle" data-start="208.1" data-duration="2.640000000000015" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Why did he ever drag you into it at all?</span></div><div data-konte-line="28:1" data-konte-said="あんたに何の関係がある？" class="konte-clip konte-subtitle" data-start="210.74" data-duration="1.6200000000000045" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">What in thunder has it to do with you?</span></div><div data-konte-line="28:1" data-konte-said="紳士二人のビジネスの話に、片方が探偵を呼ぶとはな！" class="konte-clip konte-subtitle" data-start="212.36" data-duration="3.6599999999999966" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Two gentlemen have a bit of business, and one of them calls in a detective!</span></div><div data-konte-line="29:1" data-konte-said="今朝会ったら、こんな馬鹿な真似をしたと言うんで、" class="konte-clip konte-subtitle" data-start="217.1" data-duration="2.7600000000000193" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I saw him this morning and he told me of this fool trick he'd played,</span></div><div data-konte-line="29:1" data-konte-said="すっ飛んで来たんだ。まあ、それでも気分は悪いがね。" class="konte-clip konte-subtitle" data-start="219.86" data-duration="3.359999999999985" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">so I came straight here. All the same, I feel bad about it.</span></div><div data-konte-line="30:1" data-konte-said="あなたへの当てつけではありませんよ。" class="konte-clip konte-subtitle" data-start="225.1" data-duration="1.9800000000000182" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">There was no reflection upon you, sir.</span></div><div data-konte-line="30:1" data-konte-said="目的を果たしたい一心だったんでしょう——" class="konte-clip konte-subtitle" data-start="227.32" data-duration="2.2800000000000296" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">It was simple zeal on his part to gain your end —</span></div><div data-konte-line="30:1" data-konte-said="あなた方お二人にとって、同じく大事な目的をね。" class="konte-clip konte-subtitle" data-start="229.72" data-duration="3.240000000000009" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">an end equally vital to you both.</span></div><div data-konte-line="30b:1" data-konte-said="私なら情報を集める手段がある。" class="konte-clip konte-subtitle" data-start="234.16" data-duration="2.160000000000025" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">He knew I had means of getting information,</span></div><div data-konte-line="30b:1" data-konte-said="だから私を頼るのは、ごく自然なことです。" class="konte-clip konte-subtitle" data-start="236.44" data-duration="2.8200000000000216" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">so it was very natural that he should apply to me.</span></div><div data-konte-line="31:1" data-konte-said="なるほど、そういうことなら話は別だ。" class="konte-clip konte-subtitle" data-start="241.1" data-duration="2.5200000000000102" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Well, that puts a different face on it.</span></div><div data-konte-line="31:1" data-konte-said="今朝会いに行ったら、探偵に手紙を出したと言うんで、" class="konte-clip konte-subtitle" data-start="243.92" data-duration="3.1800000000000352" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">When I saw him this morning he said he'd written to a detective,</span></div><div data-konte-line="31:1" data-konte-said="住所を聞いてすぐ来たんですよ。" class="konte-clip konte-subtitle" data-start="247.16" data-duration="1.920000000000016" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">so I asked your address and came right away.</span></div><div data-konte-line="32:1" data-konte-said="内輪の話に、警察に首を突っ込まれたくないんでね。" class="konte-clip konte-subtitle" data-start="250.46" data-duration="3.5999999999999943" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I don't want police butting into a private matter.</span></div><div data-konte-line="32:1" data-konte-said="だが、人探しを手伝ってくれるだけなら、何の問題もない。" class="konte-clip konte-subtitle" data-start="254.6" data-duration="4.02000000000001" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But if you'll just help us find the man, there's no harm in that.</span></div><div data-konte-line="33:1" data-konte-said="まさにそういうことです。" class="konte-clip konte-subtitle" data-start="259.1" data-duration="1.3799999999999955" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">That is just how it stands.</span></div><div data-konte-line="33:1" data-konte-said="では、せっかくですから、ご本人の口からはっきり聞かせていただきましょう。" class="konte-clip konte-subtitle" data-start="260.66" data-duration="3.839999999999975" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">And now, since you are here, we had best hear it plainly from your own lips.</span></div><div data-konte-line="33:1" data-konte-said="ここにいる友人は、詳しいことを何も知らないので。" class="konte-clip konte-subtitle" data-start="264.68" data-duration="3" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">My friend here knows nothing of the details.</span></div><div data-konte-line="34:1" class="konte-clip konte-subtitle" data-start="269.46" data-duration="1.5" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Need he know?</span></div><div data-konte-line="35:1" class="konte-clip konte-subtitle" data-start="272.28" data-duration="2.7000000000000455" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">We usually work together.</span></div><div data-konte-line="36:1" data-konte-said="まあ、隠すようなことでもない。手短に話しましょう。" class="konte-clip konte-subtitle" data-start="275.86" data-duration="2.9399999999999977" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Well, there's no need for secrets. I'll put it as short as I can.</span></div><div data-konte-line="36:1" data-konte-said="カンザスの人なら、" class="konte-clip konte-subtitle" data-start="278.8" data-duration="1.1399999999999864" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">If you were from Kansas, I wouldn't need to explain</span></div><div data-konte-line="36:1" data-konte-said="アレクサンダー・ハミルトン・ガリデブが誰か、説明はいらんのですがね。" class="konte-clip konte-subtitle" data-start="279.94" data-duration="3.6999999999999886" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">who Alexander Hamilton Garrideb was.</span></div><div data-konte-line="37:1" data-konte-said="不動産で財を成し、シカゴの小麦相場でも儲けた。" class="konte-clip konte-subtitle" data-start="285.4" data-duration="3.7200000000000273" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">He made his money in real estate, and in the wheat pit at Chicago.</span></div><div data-konte-line="37:1" data-konte-said="その金で、アーカンソー川沿いに、こちらの州ひとつ分ほどの土地を買い占めたんです。" class="konte-clip konte-subtitle" data-start="289.48" data-duration="5.579999999999984" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Then he spent it buying up as much land as one of your counties, along the Arkansas River.</span></div><div data-konte-line="37b:1" data-konte-said="放牧地に材木林、畑に鉱山。" class="konte-clip konte-subtitle" data-start="296.16" data-duration="2.2199999999999704" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Grazing land, lumber land, arable land, mineral land —</span></div><div data-konte-line="37b:1" data-konte-said="持ち主に金をもたらす、ありとあらゆる土地ですよ。" class="konte-clip konte-subtitle" data-start="298.68" data-duration="2.829999999999984" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">every sort of land that brings dollars to the man who owns it.</span></div><div data-konte-line="38:1" data-konte-said="身寄りはなかった。少なくとも、私は聞いたことがない。" class="konte-clip konte-subtitle" data-start="303.58" data-duration="4.140000000000043" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">He had no kin — or if he had, I never heard of it.</span></div><div data-konte-line="38:1" data-konte-said="だが、あの珍しい名字を妙に自慢にしていましてね。" class="konte-clip konte-subtitle" data-start="308.26" data-duration="4.080000000000041" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But he took a kind of pride in the queerness of his name.</span></div><div data-konte-line="38:1" data-konte-said="それが縁だったんです。" class="konte-clip konte-subtitle" data-start="312.76" data-duration="1.6200000000000045" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">That was what brought us together.</span></div><div data-konte-line="39:1" data-konte-said="私はトピーカで弁護士をしていたんだが、ある日、あの爺さんが訪ねてきた。" class="konte-clip konte-subtitle" data-start="315.52" data-duration="6.240000000000009" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I was in the law at Topeka, and one day the old man came to see me.</span></div><div data-konte-line="39:1" data-konte-said="同じ名字の男に会えたと、そりゃあもう大喜びでね。" class="konte-clip konte-subtitle" data-start="322.36" data-duration="3.759999999999991" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">He was tickled to death to meet another man with his own name.</span></div><div data-konte-line="40:1" data-konte-said="それが爺さんの道楽で、世界にほかにもガリデブがいるかどうか、何としても突き止めたがった。" class="konte-clip konte-subtitle" data-start="327.58" data-duration="6.960000000000036" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">It was his pet fad. He was dead set on finding out if there were any more Garridebs in the world.</span></div><div data-konte-line="40:1" data-konte-said="『もう一人見つけてくれ！』とね。" class="konte-clip konte-subtitle" data-start="335.44" data-duration="2.3899999999999864" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">'Find me another!' he said.</span></div><div data-konte-line="41:1" data-konte-said="世界中ガリデブ探しをして回る暇はない、と言ったら、" class="konte-clip konte-subtitle" data-start="339.28" data-duration="3.5400000000000205" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I told him I couldn't spend my life hiking round the world for Garridebs.</span></div><div data-konte-line="41:1" data-konte-said="爺さんは『それでも、" class="konte-clip konte-subtitle" data-start="342.94" data-duration="1.8600000000000136" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">'None the less,' said he,</span></div><div data-konte-line="41:1" data-konte-said="私の計画どおりに運べば、君はまさにそうすることになる』と。" class="konte-clip konte-subtitle" data-start="344.8" data-duration="4.259999999999991" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">'that is exactly what you will do if things pan out as I planned them.'</span></div><div data-konte-line="41b:1" data-konte-said="冗談だと思ったが、" class="konte-clip konte-subtitle" data-start="350.4" data-duration="1.32000000000005" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I thought he was joking,</span></div><div data-konte-line="41b:1" data-konte-said="その言葉には大変な意味があったんです。" class="konte-clip konte-subtitle" data-start="351.84" data-duration="2.5200000000000387" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">but there was a powerful lot of meaning in those words.</span></div><div data-konte-line="42:1" data-konte-said="爺さんはそれから一年もたたずに死んで、遺言を残した。" class="konte-clip konte-subtitle" data-start="355.16" data-duration="3.599999999999966" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">He died within the year and left a will behind him —</span></div><div data-konte-line="42:1" data-konte-said="カンザス州始まって以来の、とびきり奇妙な遺言です。" class="konte-clip konte-subtitle" data-start="358.94" data-duration="3.420000000000016" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">the queerest will ever filed in the State of Kansas.</span></div><div data-konte-line="43:1" data-konte-said="財産は三つに分けられて、" class="konte-clip konte-subtitle" data-start="363.34" data-duration="1.8000000000000114" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">His property was split three ways:</span></div><div data-konte-line="43:1" data-konte-said="私があと二人ガリデブを見つけたら、その一つを私に、残りをその二人に、という条件だった。" class="konte-clip konte-subtitle" data-start="365.26" data-duration="6.420000000000016" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">one share to me, if I found two more Garridebs to take the other two.</span></div><div data-konte-line="43:2" class="konte-clip konte-subtitle" data-start="372.58" data-duration="2.7600000000000477" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">That's five million dollars apiece, at the least.</span></div><div data-konte-line="44:1" class="konte-clip konte-subtitle" data-start="376.16" data-duration="3.5399999999999636" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But we can't lay a finger on it until all three of us stand in a row.</span></div><div data-konte-line="45:1" data-konte-said="またとない話だから、弁護士の仕事はほったらかしてガリデブ探しに出た。" class="konte-clip konte-subtitle" data-start="381.76" data-duration="5.400000000000034" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">It was so big a chance that I let my practice slide and went looking for Garridebs.</span></div><div data-konte-line="45:1" data-konte-said="合衆国には一人もいない。" class="konte-clip konte-subtitle" data-start="388.06" data-duration="1.8600000000000136" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">There's not one in the United States.</span></div><div data-konte-line="45:1" data-konte-said="目の細かい櫛ですくように探したが、ガリデブは一人も引っかからなかった。" class="konte-clip konte-subtitle" data-start="390.34" data-duration="4.920000000000016" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I went through the country with a fine-toothed comb, and never caught a Garrideb.</span></div><div data-konte-line="46:1" data-konte-said="そこで本国を当たってみた。" class="konte-clip konte-subtitle" data-start="397.9" data-duration="2.160000000000025" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Then I tried the old country.</span></div><div data-konte-line="46:1" data-konte-said="案の定、ロンドンの電話帳に名前があった。" class="konte-clip konte-subtitle" data-start="400.66" data-duration="3" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Sure enough, the name was in the London directory.</span></div><div data-konte-line="46:1" data-konte-said="二日前に会いに行って、すべて説明しましたよ。" class="konte-clip konte-subtitle" data-start="404.14" data-duration="2.9499999999999886" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I went to see him two days ago and explained the whole matter.</span></div><div data-konte-line="47:1" data-konte-said="ところが向こうも私と同じ一人者でね。" class="konte-clip konte-subtitle" data-start="408.46" data-duration="3.3600000000000136" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But he's a lone man, like myself —</span></div><div data-konte-line="47:1" data-konte-said="女の親戚はいるが、男は一人もいない。" class="konte-clip konte-subtitle" data-start="412.48" data-duration="3.1200000000000045" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">some women relations, but no men.</span></div><div data-konte-line="47:1" data-konte-said="遺言には『成人男子三名』とある。" class="konte-clip konte-subtitle" data-start="416.14" data-duration="3.3000000000000114" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">And the will says 'three adult men.'</span></div><div data-konte-line="47b:1" data-konte-said="というわけで、まだ一人分空きがある。" class="konte-clip konte-subtitle" data-start="420.1" data-duration="2.3999999999999773" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">So you see, we still have a vacancy.</span></div><div data-konte-line="47b:1" data-konte-said="それを埋める手伝いをしてもらえるなら、費用はいくらでもお払いしますよ。" class="konte-clip konte-subtitle" data-start="422.56" data-duration="4.019999999999982" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">If you can help fill it, we'll gladly pay your charges.</span></div><div data-konte-line="48:1" class="konte-clip konte-subtitle" data-start="429.82" data-duration="2.7000000000000455" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Well, Watson, I said it was rather whimsical, didn't I?</span></div><div data-konte-line="48:2" class="konte-clip konte-subtitle" data-start="432.76" data-duration="5.7000000000000455" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">But I should have thought, sir, your obvious way was to advertise in the agony columns of the papers.</span></div><div data-konte-line="49:1" class="konte-clip konte-subtitle" data-start="439.22" data-duration="3.5399999999999636" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I've done that, Mr. Holmes. No replies.</span></div><div data-konte-line="50:1" data-konte-said="おやおや。いや、実に興味深い、ちょっとした問題だ。" class="konte-clip konte-subtitle" data-start="442.98" data-duration="3.240000000000009" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Dear me! Well, it is certainly a most curious little problem.</span></div><div data-konte-line="50:1" data-konte-said="暇を見て考えてみましょう。" class="konte-clip konte-subtitle" data-start="446.52" data-duration="1.740000000000009" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I may take a glance at it in my leisure.</span></div><div data-konte-line="51:1" data-konte-said="ところで、トピーカのご出身とは奇遇ですな。" class="konte-clip konte-subtitle" data-start="450.52" data-duration="2.819999999999993" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">By the way, it's curious that you come from Topeka.</span></div><div data-konte-line="51:1" data-konte-said="昔、文通相手がいたんです——もう亡くなりましたが——" class="konte-clip konte-subtitle" data-start="454.42" data-duration="3.839999999999975" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I used to have a correspondent there — he is dead now —</span></div><div data-konte-line="51:1" data-konte-said="千八百九十年に市長をしていた、ライサンダー・スター博士という老人でね。" class="konte-clip konte-subtitle" data-start="458.74" data-duration="4.800000000000011" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">old Dr. Lysander Starr, who was mayor in 1890.</span></div><div data-konte-line="52:1" class="konte-clip konte-subtitle" data-start="464.22" data-duration="4.919999999999959" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Good old Dr. Starr! His name is still honoured.</span></div><div data-konte-line="53:1" data-konte-said="さて、ホームズさん、我々にできるのは、進み具合をご報告することくらいですな。" class="konte-clip konte-subtitle" data-start="470.46" data-duration="5.220000000000027" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Well, Mr. Holmes, I suppose all we can do is report how we get on.</span></div><div data-konte-line="53:1" data-konte-said="一日、二日のうちには、お知らせできるでしょう。" class="konte-clip konte-subtitle" data-start="476.46" data-duration="2.9400000000000546" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I reckon you'll hear within a day or two.</span></div><div data-konte-line="56:1" class="konte-clip konte-subtitle" data-start="490.52" data-duration="0.5" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Well?</span></div><div data-konte-line="57:1" class="konte-clip konte-subtitle" data-start="493.34" data-duration="3.420000000000016" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I am wondering, Watson — just wondering!</span></div><div data-konte-line="57:2" class="konte-clip konte-subtitle" data-start="496.74" data-duration="0.4800000000000182" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">At what?</span></div><div data-konte-line="59:1" data-konte-said="考えていたのはね、ワトスン、あの男がいったい何のつもりで、" class="konte-clip konte-subtitle" data-start="499.98" data-duration="3.5399999999999636" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I was wondering, Watson, what on earth could be the man's object</span></div><div data-konte-line="59:1" data-konte-said="あんな嘘八百を並べたのかということさ。" class="konte-clip konte-subtitle" data-start="503.52" data-duration="2.400000000000034" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">in telling us such a rigmarole of lies.</span></div><div data-konte-line="60:1" data-konte-said="よほど面と向かって問いただそうかと思ったよ。" class="konte-clip konte-subtitle" data-start="507.22" data-duration="2.4599999999999795" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I nearly asked him point-blank —</span></div><div data-konte-line="60:1" data-konte-said="正面から殴りかかるのが一番という時もあるからね。" class="konte-clip konte-subtitle" data-start="509.92" data-duration="2.819999999999993" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">there are times when a brutal frontal attack is best —</span></div><div data-konte-line="60:1" data-konte-said="だが、こちらが騙されたと思わせておくほうがいいと判断した。" class="konte-clip konte-subtitle" data-start="513.16" data-duration="3.240000000000009" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">but I judged it better to let him think he had fooled us.</span></div><div data-konte-line="61:1" data-konte-said="肘の擦り切れた英国製の上着に、" class="konte-clip konte-subtitle" data-start="517.7" data-duration="2.519999999999868" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">An English coat frayed at the elbow,</span></div><div data-konte-line="61:1" data-konte-said="一年も着古して膝の出たズボン。" class="konte-clip konte-subtitle" data-start="520.52" data-duration="2.4599999999999227" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">trousers bagged at the knee with a year's wear —</span></div><div data-konte-line="61:1" data-konte-said="それでいて、あの書類でも本人の話でも、" class="konte-clip konte-subtitle" data-start="523.82" data-duration="3.2999999999999545" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">yet by his papers and his own account,</span></div><div data-konte-line="61:1" data-konte-said="ロンドンに着いたばかりの田舎のアメリカ人だという。" class="konte-clip konte-subtitle" data-start="527.42" data-duration="3.1200000000000045" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">he is a provincial American fresh to London.</span></div><div data-konte-line="62:1" data-konte-said="尋ね人欄に広告など出ていない。" class="konte-clip konte-subtitle" data-start="531.16" data-duration="2.2200000000000273" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">There have been no advertisements in the agony columns.</span></div><div data-konte-line="62:1" data-konte-said="あそこは私が何ひとつ見逃さない場所だ。" class="konte-clip konte-subtitle" data-start="533.56" data-duration="2.4600000000000364" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">You know I miss nothing there.</span></div><div data-konte-line="62:1" data-konte-said="あれほどの大物を見落とすはずがない。" class="konte-clip konte-subtitle" data-start="536.26" data-duration="2.75" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I could never have overlooked so big a fish.</span></div><div data-konte-line="63:1" data-konte-said="トピーカのライサンダー・スター博士なんて人物も、私は知らない。" class="konte-clip konte-subtitle" data-start="540.28" data-duration="3.6000000000000227" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">And I never knew any Dr. Lysander Starr of Topeka.</span></div><div data-konte-line="63:1" data-konte-said="どこを突いても、あの男は偽物だった。" class="konte-clip konte-subtitle" data-start="544.18" data-duration="2.340000000000032" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">Touch him where you will, he is false.</span></div><div data-konte-line="64:1" data-konte-said="アメリカ人なのは本当だろう。" class="konte-clip konte-subtitle" data-start="548.2" data-duration="1.8599999999999" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">I think the fellow really is an American,</span></div><div data-konte-line="64:1" data-konte-said="だが長年ロンドンにいて、訛りがすり減っている。" class="konte-clip konte-subtitle" data-start="550.54" data-duration="3.2999999999999545" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">but years in London have worn his accent smooth.</span></div><div data-konte-line="64:1" data-konte-said="では、狙いは何だ？" class="konte-clip konte-subtitle" data-start="554.56" data-duration="1.4400000000000546" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">What is his game, then?</span></div><div data-konte-line="64:1" data-konte-said="このばかげたガリデブ探しの裏に、どんな動機がある？" class="konte-clip konte-subtitle" data-start="558.16" data-duration="3.659999999999968" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">What motive lies behind this preposterous search for Garridebs?</span></div><div data-konte-line="65:1" class="konte-clip konte-subtitle" data-start="562.78" data-duration="1.57000000000005" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">It's worth our attention, Watson.</span></div><div data-konte-line="66:1" data-konte-said="あの男が悪党だとしても、" class="konte-clip konte-subtitle" data-start="566.1" data-duration="1.8599999999999" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">If the man is a rascal,</span></div><div data-konte-line="66:1" data-konte-said="実に複雑で、手の込んだ悪党だ。" class="konte-clip konte-subtitle" data-start="568.02" data-duration="2.339999999999918" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000]">he is certainly a complex and ingenious one.</span></div><div data-konte-line="01:1" data-konte-said="これから話すのは、喜劇とも悲劇ともつかない事件だ。" class="konte-clip konte-subtitle" data-start="0.56" data-duration="3.6" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">What follows was an affair that hovered between comedy and tragedy.</span></div><div data-konte-line="01:1" data-konte-said="その結末で、一人の男は正気を失い、私は銃弾を受け、" class="konte-clip konte-subtitle" data-start="4.88" data-duration="4.500000000000001" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">By its end, one man had lost his reason, I had taken a bullet,</span></div><div data-konte-line="01:1" data-konte-said="もう一人の男は監獄へ送られた。" class="konte-clip konte-subtitle" data-start="9.56" data-duration="1.8599999999999994" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">and another man had been sent to prison.</span></div><div data-konte-line="02:1" data-konte-said="それでも、どこか可笑しみのある事件だった。" class="konte-clip konte-subtitle" data-start="12.46" data-duration="3.1799999999999997" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">And yet there was something comic about it all.</span></div><div data-konte-line="02:1" data-konte-said="千九百二年、六月の終わり。" class="konte-clip konte-subtitle" data-start="16.42" data-duration="2.5799999999999983" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">It was the end of June, 1902.</span></div><div data-konte-line="02:1" data-konte-said="何日も寝込んでいたホームズが、その朝、ようやく居間に姿を現した。" class="konte-clip konte-subtitle" data-start="19.6" data-duration="4.839999999999996" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">Holmes, who had kept to his bed for days, at last appeared in the sitting room that morning.</span></div><div data-konte-line="07:1" data-konte-said="私はそばにあった電話帳を手に取り、" class="konte-clip konte-subtitle" data-start="59.42" data-duration="2.3999999999999986" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">I picked up the directory that lay beside me</span></div><div data-konte-line="07:1" data-konte-said="望み薄の気持ちでページをめくった。" class="konte-clip konte-subtitle" data-start="62.18" data-duration="2.039999999999999" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">and turned its pages with little hope.</span></div><div data-konte-line="08:1" class="konte-clip konte-subtitle" data-start="66.26" data-duration="5.059999999999988" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">But to my surprise, that strange name was there after all.</span></div><div data-konte-line="12:1" class="konte-clip konte-subtitle" data-start="92.42" data-duration="3.9599999999999937" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">Just then Mrs. Hudson came in with a card on a tray.</span></div><div data-konte-line="16:1" class="konte-clip konte-subtitle" data-start="123.36" data-duration="3" data-track-index="10"><span class="text-[2.3vmax] font-semibold leading-snug text-[#f3ead8] [text-shadow:0_0_0.2vmax_#000,0_0_0.5vmax_#000,0_0_1vmax_#000] italic">A moment later, the man himself entered the room.</span></div><script>(function(){var g=window.gsap;if(!g||!g.timeline)return;window.__timelines=window.__timelines||{};var key="shot-timeline.overlay";var tl=window.__timelines[key];if(!tl||typeof tl.set!=="function"){tl=g.timeline({paused:true});window.__timelines[key]=tl;}tl.set({},{},571.5);})()</script></template><script>(function(){var g=window.gsap;if(!g||!g.timeline)return;window.__timelines=window.__timelines||{};var key="shot-timeline.overlay.frame";var tl=window.__timelines[key];if(!tl||typeof tl.set!=="function"){tl=g.timeline({paused:true});window.__timelines[key]=tl;}tl.set({},{},571.5);})()</script>
